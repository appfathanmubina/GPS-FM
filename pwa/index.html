<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#800080">
<meta name="application-name" content="GPS FM">
<meta name="apple-mobile-web-app-title" content="GPS FM">
<link rel="icon" type="image/png" sizes="250x250" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="manifest" href="./manifest.json">
<!-- OneSignal Web Push -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  var gpsfmAppFrame = null;
  let gpsfmPendingExternalUserId = '';
  let gpsfmOneSignalInstance = null;
  let gpsfmPushRegistrationTimer = null;
  let gpsfmPushRegistrationAttempts = 0;
  let gpsfmPushRegistrationAckId = '';
  let gpsfmManualPushRequested = false;
  function gpsfmStopPushRegistrationRetry() {
    if (gpsfmPushRegistrationTimer) clearTimeout(gpsfmPushRegistrationTimer);
    gpsfmPushRegistrationTimer = null;
  }
  function gpsfmNotifyAppPushState(state,message) {
    try {
      if (gpsfmAppFrame && gpsfmAppFrame.contentWindow) gpsfmAppFrame.contentWindow.postMessage({type:'gpsfm-push-state',state:String(state||'idle'),message:String(message||'')},'*');
    } catch (error) {}
  }
  function gpsfmSendSubscriptionToApp() {
    if (!gpsfmAppFrame || !gpsfmAppFrame.contentWindow || !gpsfmOneSignalInstance || !gpsfmPendingExternalUserId) return false;
    const pushSubscription = gpsfmOneSignalInstance.User.PushSubscription;
    // Jangan daftarkan ID lama/perangkat yang sudah opt-out sebagai subscription aktif.
    if (pushSubscription.optedIn !== true) return false;
    const subscriptionId = pushSubscription.id;
    if (!subscriptionId) return false;
    gpsfmAppFrame.contentWindow.postMessage({type:'gpsfm-push-subscription',subscriptionId:String(subscriptionId)}, '*');
    return true;
  }
  function gpsfmRequestPushRegistration() {
    gpsfmStopPushRegistrationRetry();
    gpsfmPushRegistrationAttempts = 0;
    // Jangan membuat siklus retry saat izin belum diberikan atau pengguna memilih opt-out.
    if (!gpsfmPendingExternalUserId || !('Notification' in window) || Notification.permission !== 'granted') return;
    try {
      if (localStorage.getItem('gpsfm_push_optout_' + gpsfmPendingExternalUserId) === '1') return;
    } catch (storageError) {}
    const attempt = function() {
      if (gpsfmPushRegistrationAckId) return;
      gpsfmPushRegistrationAttempts++;
      const sent = gpsfmSendSubscriptionToApp();
      if (gpsfmPushRegistrationAttempts < 30) {
        gpsfmPushRegistrationTimer = setTimeout(attempt, sent ? 1500 : 1000);
      } else {
        if (!sent) console.warn('GPS FM: ID subscription OneSignal belum tersedia setelah 30 percobaan.');
        else console.warn('GPS FM: Apps Script belum mengonfirmasi penyimpanan subscription setelah 30 percobaan.');
        gpsfmNotifyAppPushState('error','Subscription belum berhasil terhubung ke akun GPS FM. Periksa izin notifikasi, lalu tekan Aktifkan Notifikasi untuk mencoba lagi.');
      }
    };
    attempt();
  }
  window.addEventListener('message', async function(event) {
    if (!gpsfmAppFrame || event.source !== gpsfmAppFrame.contentWindow) return;
    if (!(event.origin === 'https://script.google.com' || /^https:\/\/[^/]+\.googleusercontent\.com$/.test(event.origin))) return;
    const data = event.data || {};
    if (data.type === 'gpsfm-auth' && data.userId) {
      gpsfmPendingExternalUserId = String(data.userId);
      gpsfmPushRegistrationAckId = '';
      try {
        if (gpsfmOneSignalInstance) {
          await gpsfmOneSignalInstance.login(gpsfmPendingExternalUserId);
          const optedOutByUser = localStorage.getItem('gpsfm_push_optout_' + gpsfmPendingExternalUserId) === '1';
          if (optedOutByUser) {
            gpsfmStopPushRegistrationRetry();
            gpsfmNotifyAppPushState('idle','Notifikasi dinonaktifkan untuk akun ini pada perangkat ini.');
          } else {
            if (Notification.permission === 'granted') await gpsfmOneSignalInstance.User.PushSubscription.optIn();
            gpsfmRequestPushRegistration();
          }
        }
      } catch (error) { console.warn('Pengaitan akun OneSignal belum berhasil:', error); }
    } else if (data.type === 'gpsfm-push-registration-result') {
      if (data.ok && data.subscriptionId) {
        gpsfmPushRegistrationAckId = String(data.subscriptionId);
        gpsfmStopPushRegistrationRetry();
        console.info('GPS FM: subscription perangkat berhasil ditautkan ke akun aplikasi.');
        gpsfmNotifyAppPushState('active','Notifikasi aktif dan perangkat sudah terhubung ke akun GPS FM.');
      } else {
        console.warn('GPS FM: Apps Script gagal menyimpan subscription:', data.message || 'Tidak ada keterangan.');
        gpsfmNotifyAppPushState('error',data.message || 'Subscription belum berhasil disimpan.');
      }
    } else if (data.type === 'gpsfm-enable-push') {
      // Permintaan berasal dari iframe Apps Script. Tampilkan konfirmasi di shell
      // PWA agar klik pemberian izin berikutnya benar-benar terjadi pada top-level page.
      if (!gpsfmPendingExternalUserId) {
        gpsfmNotifyAppPushState('error','Silakan login kembali sebelum mengaktifkan notifikasi.');
        return;
      }
      if (!gpsfmOneSignalInstance) {
        gpsfmNotifyAppPushState('error','Layanan notifikasi sedang dimuat. Muat ulang aplikasi lalu coba kembali.');
        return;
      }
      if (Notification.permission === 'denied') {
        gpsfmNotifyAppPushState('denied','Izin notifikasi diblokir. Aktifkan izin GPS FM melalui pengaturan situs di browser.');
        return;
      }
      if (Notification.permission === 'granted') {
        try {
          await gpsfmOneSignalInstance.login(gpsfmPendingExternalUserId);
          try { localStorage.removeItem('gpsfm_push_optout_' + gpsfmPendingExternalUserId); } catch (storageError) {}
          await gpsfmOneSignalInstance.User.PushSubscription.optIn();
          gpsfmNotifyAppPushState('working','Izin sudah aktif. Menghubungkan perangkat dengan akun GPS FM...');
          gpsfmRequestPushRegistration();
        } catch (error) {
          console.warn('GPS FM: aktivasi notifikasi manual gagal:',error);
          gpsfmNotifyAppPushState('error',error && error.message || 'Aktivasi notifikasi belum berhasil.');
        }
        return;
      }
      gpsfmManualPushRequested = true;
      const prompt = document.getElementById('gpsNotificationPrompt');
      const description = prompt && prompt.querySelector('.gps-notification-description');
      const enableButton = document.getElementById('gpsEnableNotifications');
      if (description) description.textContent = 'Untuk mengizinkan notifikasi, tekan tombol Aktifkan di sini. Browser akan menampilkan permintaan izin.';
      if (enableButton) enableButton.textContent = 'Izinkan Notifikasi';
      if (prompt) prompt.style.display = 'flex';
      gpsfmNotifyAppPushState('working','Konfirmasi izin diperlukan. Tekan tombol Izinkan Notifikasi pada jendela konfirmasi GPS FM.');
    } else if (data.type === 'gpsfm-disable-push') {
      try {
        if (!gpsfmOneSignalInstance || !gpsfmPendingExternalUserId) throw new Error('Akun atau layanan notifikasi belum siap.');
        try { localStorage.setItem('gpsfm_push_optout_' + gpsfmPendingExternalUserId,'1'); } catch (storageError) {}
        gpsfmStopPushRegistrationRetry();
        gpsfmPushRegistrationAckId = '';
        await gpsfmOneSignalInstance.User.PushSubscription.optOut();
        gpsfmNotifyAppPushState('idle','Notifikasi dinonaktifkan pada perangkat ini. Anda dapat mengaktifkannya kembali kapan saja.');
      } catch (error) {
        gpsfmNotifyAppPushState('error',error && error.message || 'Notifikasi belum berhasil dinonaktifkan.');
      }
    } else if (data.type === 'gpsfm-logout') {
      gpsfmPendingExternalUserId = '';
      gpsfmPushRegistrationAckId = '';
      gpsfmStopPushRegistrationRetry();
      try { if (gpsfmOneSignalInstance) await gpsfmOneSignalInstance.logout(); } catch (error) {}
    }
  });
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "28faec3d-9ee1-45a0-9234-4a5922ce4f1a",
      serviceWorkerPath: "/GPS/sw.js",
      serviceWorkerParam: { scope: "/GPS/" }
    });

    gpsfmOneSignalInstance = OneSignal;
    try {
      OneSignal.User.PushSubscription.addEventListener('change', gpsfmRequestPushRegistration);
    } catch (error) {}
    if (gpsfmPendingExternalUserId) {
      try {
        await OneSignal.login(gpsfmPendingExternalUserId);
        const optedOutByUser = localStorage.getItem('gpsfm_push_optout_' + gpsfmPendingExternalUserId) === '1';
        if (optedOutByUser) {
          gpsfmNotifyAppPushState('idle','Notifikasi dinonaktifkan untuk akun ini pada perangkat ini.');
        } else {
          if (Notification.permission === 'granted') await OneSignal.User.PushSubscription.optIn();
          gpsfmRequestPushRegistration();
        }
      } catch (error) { console.warn('Sinkronisasi langganan OneSignal tertunda:', error); }
    }
    // Tampilkan ajakan izin hanya jika pengguna belum menentukan izin.
    const notificationPrompt = document.getElementById('gpsNotificationPrompt');
    const enableNotificationButton = document.getElementById('gpsEnableNotifications');
    const dismissNotificationButton = document.getElementById('gpsDismissNotifications');
    const dismissed = localStorage.getItem('gpsfm_notification_prompt_dismissed') === '1';
    const supported = 'Notification' in window && 'serviceWorker' in navigator;

    if (notificationPrompt && supported && Notification.permission === 'default' && !dismissed) {
      notificationPrompt.style.display = 'flex';
    }

    if (enableNotificationButton) {
      enableNotificationButton.addEventListener('click', async () => {
        enableNotificationButton.disabled = true;
        enableNotificationButton.textContent = 'Memproses...';
        try {
          // Panggilan izin dilakukan langsung dari klik di halaman PWA teratas,
          // bukan dari postMessage iframe yang tidak membawa user activation.
          await OneSignal.Notifications.requestPermission();
          if (Notification.permission === 'granted') {
            if (gpsfmPendingExternalUserId) await OneSignal.login(gpsfmPendingExternalUserId);
            await OneSignal.User.PushSubscription.optIn();
            try { if (gpsfmPendingExternalUserId) localStorage.removeItem('gpsfm_push_optout_' + gpsfmPendingExternalUserId); } catch (storageError) {}
            gpsfmRequestPushRegistration();
            notificationPrompt.style.display = 'none';
            enableNotificationButton.textContent = 'Aktifkan Notifikasi';
            enableNotificationButton.disabled = false;
            gpsfmManualPushRequested = false;
            gpsfmNotifyAppPushState('working','Izin diberikan. Menyimpan langganan perangkat ke akun GPS FM...');
          } else if (Notification.permission === 'denied') {
            notificationPrompt.querySelector('.gps-notification-description').textContent =
              'Izin notifikasi diblokir oleh browser. Aktifkan GPS FM melalui pengaturan izin situs di browser.';
            enableNotificationButton.style.display = 'none';
            dismissNotificationButton.textContent = 'Mengerti';
            gpsfmNotifyAppPushState('denied','Izin notifikasi diblokir. Ubah izin situs di browser, lalu coba kembali.');
          } else {
            enableNotificationButton.disabled = false;
            enableNotificationButton.textContent = 'Izinkan Notifikasi';
            gpsfmNotifyAppPushState('error','Izin notifikasi belum diberikan. Tekan Izinkan Notifikasi untuk mencoba kembali.');
          }
        } catch (error) {
          console.error('Permintaan izin notifikasi gagal:', error);
          enableNotificationButton.disabled = false;
          enableNotificationButton.textContent = 'Coba Lagi';
          gpsfmNotifyAppPushState('error',error && error.message || 'Permintaan izin notifikasi gagal. Silakan coba kembali.');
        }
      });
    }

    if (dismissNotificationButton) {
      dismissNotificationButton.addEventListener('click', () => {
        localStorage.setItem('gpsfm_notification_prompt_dismissed', '1');
        notificationPrompt.style.display = 'none';
      });
    }
  });
</script>
<title>GPS FM</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui;background:#f5f7fc;color:#18213b}
main{width:100%;height:100%;height:100dvh}
iframe{display:block;width:100%;height:100%;border:0}
section{max-width:640px;margin:10vh auto;background:white;padding:24px;border-radius:16px;line-height:1.6}
#installGpsFm{position:fixed;z-index:100;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));display:none;align-items:center;gap:9px;padding:13px 17px;border:0;border-radius:999px;background:#800080;color:#fff;font:700 14px system-ui;box-shadow:0 8px 28px #4a004a45;cursor:pointer}
#installGpsFm svg{width:19px;height:19px;flex:none}
#installHelp{position:fixed;z-index:101;inset:0;display:none;align-items:flex-end;justify-content:center;padding:16px;background:#170d1f70}
#installHelp .sheet{width:min(100%,440px);padding:22px 20px calc(22px + env(safe-area-inset-bottom));border-radius:22px;background:#fff;color:#242033;box-shadow:0 15px 50px #0003;line-height:1.55}
#installHelp h2{font-size:19px;margin:0 0 10px}
#installHelp p{font-size:14px;margin:8px 0}
#installHelp button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:#800080;color:#fff;font:700 14px system-ui}
#gpsNotificationPrompt{position:fixed;z-index:110;left:50%;top:14px;transform:translateX(-50%);width:min(calc(100% - 28px),460px);display:none;align-items:center;gap:12px;padding:14px 15px;border:1px solid #ead8ee;border-radius:16px;background:#fff;color:#242033;box-shadow:0 10px 35px #25002526}
#gpsNotificationPrompt .gps-notification-copy{flex:1;min-width:0}
#gpsNotificationPrompt strong{display:block;font-size:14px;margin-bottom:3px}
#gpsNotificationPrompt .gps-notification-description{margin:0;color:#716879;font-size:12px;line-height:1.45}
#gpsNotificationPrompt .gps-notification-actions{display:flex;flex-direction:column;gap:6px;flex:none}
#gpsNotificationPrompt button{border:0;border-radius:9px;padding:8px 10px;font:700 12px system-ui;cursor:pointer}
#gpsEnableNotifications{background:#800080;color:#fff}
#gpsDismissNotifications{background:#f5f0f6;color:#62576a}
#gpsNotificationPrompt button:disabled{opacity:.65;cursor:wait}
@media(max-width:420px){#gpsNotificationPrompt{align-items:flex-start;gap:8px;padding:12px}#gpsNotificationPrompt .gps-notification-actions{min-width:112px}#gpsNotificationPrompt button{padding:8px 7px;font-size:11px}}
@media(min-width:781px){#installGpsFm{bottom:24px}}
@media(max-width:380px){#installGpsFm{right:10px;padding:11px 13px;font-size:12px}}
</style>
</head>
<body>
<main id="app"></main>
<aside id="gpsNotificationPrompt" role="region" aria-label="Aktifkan notifikasi GPS FM">
  <div class="gps-notification-copy">
    <strong>Aktifkan Notifikasi GPS FM</strong>
    <p class="gps-notification-description">Izinkan notifikasi agar Anda tidak ketinggalan informasi dan pemberitahuan penting dari aplikasi.</p>
  </div>
  <div class="gps-notification-actions">
    <button id="gpsEnableNotifications" type="button">Aktifkan Notifikasi</button>
    <button id="gpsDismissNotifications" type="button">Nanti</button>
  </div>
</aside>
<button id="installGpsFm" type="button" aria-label="Install aplikasi GPS FM"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 16v4h14v-4"/></svg><span>Install GPS FM</span></button>
<div id="installHelp" role="dialog" aria-modal="true" aria-labelledby="installHelpTitle"><div class="sheet"><h2 id="installHelpTitle">Pasang GPS FM di HP</h2><p id="installHelpText">Gunakan menu browser untuk menambahkan GPS FM ke layar utama.</p><button id="closeInstallHelp" type="button">Mengerti</button></div></div>
<script src="./config.js"></script>
<script>
const u=window.GPSFM_CONFIG&&window.GPSFM_CONFIG.appsScriptUrl;
gpsfmAppFrame=null;
if(u&&u.indexOf('https://script.google.com/macros/s/')===0){
 const f=document.createElement('iframe');
 gpsfmAppFrame=f;
 f.title='GPS FM';
 f.src=u;
 f.addEventListener('load',()=>{const status=document.getElementById('appStatus');if(status)status.remove();});
 document.getElementById('app').appendChild(f);
}else{
 const status=document.getElementById('appStatus');
 if(status)status.innerHTML='<h2>GPS FM belum dikonfigurasi</h2><p>URL Web App Apps Script belum ditemukan atau formatnya tidak valid. Periksa file <code>pwa/config.js</code>.</p>';
}
let deferredInstallPrompt=null;
const installButton=document.getElementById('installGpsFm');
const installHelp=document.getElementById('installHelp');
const installHelpText=document.getElementById('installHelpText');
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
function syncInstallButton(){installButton.style.display=(!isStandalone()?'flex':'none');}
function showInstallHelp(text){installHelpText.textContent=text;installHelp.style.display='flex';}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;syncInstallButton();});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installButton.style.display='none';});
installButton.addEventListener('click',async()=>{
 if(deferredInstallPrompt){
  deferredInstallPrompt.prompt();
  const choice=await deferredInstallPrompt.userChoice;
  if(choice&&choice.outcome==='accepted')installButton.style.display='none';
  deferredInstallPrompt=null;
  return;
 }
 const ua=navigator.userAgent||'';
 if(/iphone|ipad|ipod/i.test(ua)){
  showInstallHelp('Di Safari, ketuk tombol Bagikan, lalu pilih “Tambahkan ke Layar Utama” dan ketuk Tambah.');
 }else if(/android/i.test(ua)){
  showInstallHelp('Buka menu ⋮ pada Chrome, lalu pilih “Install app” atau “Tambahkan ke layar utama”. Jika pilihan belum muncul, muat ulang halaman dan coba lagi.');
 }else{
  showInstallHelp('Buka menu browser lalu pilih “Install GPS FM” atau “Tambahkan ke layar utama”, jika tersedia.');
 }
});
document.getElementById('closeInstallHelp').addEventListener('click',()=>{installHelp.style.display='none';});
installHelp.addEventListener('click',event=>{if(event.target===installHelp)installHelp.style.display='none';});
syncInstallButton();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
