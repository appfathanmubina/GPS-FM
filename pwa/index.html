</head><body><header>GPS FM · Absensi Guru Pembina Santri</header><main id="app"><section><h2>GPS FM belum dikonfigurasi</h2><p>Tambahkan URL Web App Apps Script pada file <code>pwa/config.js</code>.</p></section></main><script src="./config.js"></script><script>const u=window.GPSFM_CONFIG&&window.GPSFM_CONFIG.appsScriptUrl;if(u&&u.indexOf('https://script.google.com/macros/s/')===0){const f=document.createElement('iframe');f.title='GPS FM';f.src=u;document.getElementById('app').replaceChildren(f)}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
