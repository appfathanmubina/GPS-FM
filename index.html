<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8e33f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GPS FM">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>GPS FM — Guru Pembina Santri</title>
  <style>
    :root{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:#302340;background:#f7f0ff;--purple:#8e33f5;--line:#e9def7;--muted:#766985}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:flex;flex-direction:column;background:linear-gradient(135deg,#e9d9ff 0%,#f7f0ff 48%,#e4d2ff 100%);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    .topbar{display:flex;align-items:center;gap:12px;min-height:66px;padding:9px 16px;color:#fff;background:linear-gradient(115deg,#541793,#7a1edc 55%,#a259ff);box-shadow:0 5px 20px #54179320;z-index:1}.brand-icon{width:42px;height:42px;padding:3px;flex:none;border-radius:13px;background:#fff}.brand-icon img{display:block;width:100%;height:100%;object-fit:contain}.brand-copy{min-width:0;flex:1}.brand-copy h1{margin:0;font-size:17px;line-height:1.2;font-weight:800;letter-spacing:-.03em}.brand-copy p{margin:3px 0 0;color:#f2e8ff;font-size:10px}.top-actions{display:flex;align-items:center;gap:7px}.top-button{display:none;min-height:38px;padding:8px 11px;border:1px solid #ffffff72;border-radius:11px;background:#ffffff1c;color:#fff;font-size:11px;font-weight:700;font-family:inherit;white-space:nowrap}.top-button[hidden]{display:none}.top-button.visible{display:block}.top-button:focus-visible{outline:3px solid #fff;outline-offset:2px}.external-link{display:block;padding:8px 10px;border:1px solid #ffffff72;border-radius:11px;color:#fff;text-decoration:none;font-size:11px;font-weight:700;white-space:nowrap}
    main{position:relative;flex:1;min-height:0;padding:0;background:#fff}.app-frame{display:block;width:100%;height:100%;border:0;background:#f7f5fb}.frame-status{position:absolute;left:12px;right:12px;bottom:12px;margin:auto;width:max-content;max-width:calc(100% - 24px);padding:9px 13px;border:1px solid #e9def7;border-radius:12px;background:#fff;color:#766985;font-size:12px;box-shadow:0 5px 18px #2b17421c}.frame-status[hidden]{display:none}.install-help{position:absolute;left:12px;right:12px;bottom:12px;max-width:560px;margin:auto;padding:13px 15px;border:1px solid #e9def7;border-radius:14px;background:#fff;color:#766985;font-size:12px;line-height:1.6;box-shadow:0 5px 18px #2b17421c}.install-help[hidden]{display:none}.install-help strong{color:#49385a}
    @media(max-width:480px){.topbar{min-height:60px;padding:8px 10px;gap:8px}.brand-icon{width:36px;height:36px;border-radius:11px}.brand-copy h1{font-size:15px}.brand-copy p{font-size:9px}.external-link{padding:7px 8px;font-size:10px}.top-button{padding:7px 8px;font-size:10px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-icon"><img src="./icons/icon.svg" alt=""></div>
    <div class="brand-copy"><h1>GPS FM</h1><p>Guru Pembina Santri · Fathan Mubina</p></div>
    <div class="top-actions">
      <button id="installButton" class="top-button" type="button" hidden>Pasang</button>
      <a class="external-link" href="https://script.google.com/macros/s/AKfycbyL4HyR75j-duBKliOJLgtNvXVdajQFvy1AKq6zmFWudA5rBK0zI7nFbxH2WuCqkemR/exec" target="_blank" rel="noopener">Buka terpisah</a>
    </div>
  </header>
  <main>
    <iframe id="appFrame" class="app-frame" title="Aplikasi GPS FM" src="https://script.google.com/macros/s/AKfycbyL4HyR75j-duBKliOJLgtNvXVdajQFvy1AKq6zmFWudA5rBK0zI7nFbxH2WuCqkemR/exec" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write"></iframe>
    <p id="frameStatus" class="frame-status" role="status" aria-live="polite">Memuat aplikasi GPS FM…</p>
    <div id="installHelp" class="install-help" hidden>Untuk memasang GPS FM di iPhone/iPad: buka halaman ini di Safari, ketuk <strong>Bagikan</strong>, lalu pilih <strong>Tambahkan ke Layar Utama</strong>.</div>
  </main>
  <script>
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
    const appFrame=document.getElementById('appFrame');
    const frameStatus=document.getElementById('frameStatus');
    const installButton=document.getElementById('installButton');
    const installHelp=document.getElementById('installHelp');
    let deferredInstallPrompt=null;
    appFrame.addEventListener('load',()=>{frameStatus.hidden=true});
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;installButton.hidden=false;installButton.classList.add('visible');installHelp.hidden=true});
    installButton.addEventListener('click',async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installButton.hidden=true});
    window.addEventListener('appinstalled',()=>{installButton.hidden=true;installHelp.hidden=true});
    const installed=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
    if(!installed&&/(iPhone|iPad|iPod)/i.test(navigator.userAgent))installHelp.hidden=false;
  </script>
</body>
</html>
