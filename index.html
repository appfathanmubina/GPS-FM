<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6f2dbd">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GPS FM">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>GPS FM — Guru Pembina Santri</title>
  <style>
    :root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f7fa;color:#30243b;--purple:#6f2dbd;--ink:#30243b;--muted:#71677b;--line:#e9e4ee}
    *{box-sizing:border-box}html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden}body{background:#f8f7fa}
    main{position:relative;width:100%;height:100%;height:100dvh;background:#fff}.app-frame{display:block;width:100%;height:100%;border:0;background:#fff}
    .loader{position:fixed;z-index:2;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;background:#faf9fc;color:var(--muted);font-size:13px;letter-spacing:.01em;transition:opacity .25s ease,visibility .25s ease}.loader[hidden]{display:none}.loader-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#f0e7f8;color:var(--purple);font-size:20px;font-weight:800}.spinner{width:20px;height:20px;border:2px solid #e8dff0;border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .install-button{position:fixed;z-index:4;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:none;align-items:center;gap:9px;min-height:46px;padding:0 18px;border:0;border-radius:15px;background:var(--purple);color:#fff;font-family:inherit;font-size:13px;font-weight:650;box-shadow:0 8px 24px #35135435;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}.install-button.visible{display:inline-flex}.install-button[hidden]{display:none}.install-button:hover{transform:translateY(-2px);box-shadow:0 11px 28px #35135442}.install-button:focus-visible,.dismiss:focus-visible{outline:3px solid #b991df;outline-offset:3px}.install-icon{font-size:17px;line-height:1}
    .install-help{position:fixed;z-index:3;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:480px;margin:auto;display:flex;align-items:flex-start;gap:12px;padding:16px 16px 16px 18px;border:1px solid #eee7f3;border-radius:18px;background:#fff;color:var(--muted);font-size:13px;line-height:1.55;box-shadow:0 12px 36px #2816381c}.install-help[hidden]{display:none}.help-icon{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#f2eafb;color:var(--purple);font-size:16px}.help-copy{flex:1}.help-copy strong{display:block;margin-bottom:3px;color:var(--ink);font-size:13px}.dismiss{flex:none;width:30px;height:30px;border:0;border-radius:9px;background:transparent;color:#776b81;font-size:20px;line-height:1;cursor:pointer}.dismiss:hover{background:#f5f1f8}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main>
    <iframe id="appFrame" class="app-frame" title="Aplikasi GPS FM" src="https://script.google.com/macros/s/AKfycbyL4HyR75j-duBKliOJLgtNvXVdajQFvy1AKq6zmFWudA5rBK0zI7nFbxH2WuCqkemR/exec" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <div id="loader" class="loader" role="status" aria-live="polite"><span class="loader-mark">G</span><span class="spinner" aria-hidden="true"></span><span>Membuka GPS FM…</span></div>
  <button id="installButton" class="install-button" type="button" hidden><span class="install-icon" aria-hidden="true">↓</span>Pasang GPS FM</button>
  <aside id="installHelp" class="install-help" aria-label="Petunjuk pemasangan" hidden>
    <span class="help-icon" aria-hidden="true">＋</span>
    <div class="help-copy"><strong>Pasang GPS FM</strong>Ketuk <b>Bagikan</b>, lalu pilih <b>Tambahkan ke Layar Utama</b> untuk memasangnya.</div>
    <button id="dismissHelp" class="dismiss" type="button" aria-label="Tutup petunjuk">×</button>
  </aside>
  <script>
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
    const appFrame=document.getElementById('appFrame');
    const loader=document.getElementById('loader');
    const installButton=document.getElementById('installButton');
    const installHelp=document.getElementById('installHelp');
    let deferredInstallPrompt=null;
    appFrame.addEventListener('load',()=>{loader.hidden=true});
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;installButton.hidden=false;installButton.classList.add('visible');installHelp.hidden=true});
    installButton.addEventListener('click',async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installButton.hidden=true});
    window.addEventListener('appinstalled',()=>{installButton.hidden=true;installHelp.hidden=true});
    document.getElementById('dismissHelp').addEventListener('click',()=>{installHelp.hidden=true});
    const installed=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
    if(!installed&&/(iPhone|iPad|iPod)/i.test(navigator.userAgent))installHelp.hidden=false;
  </script>
</body>
</html>
