<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8e33f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GPS FM">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>GPS FM — Guru Pembina Santri</title>
  <style>
    :root{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:#302340;background:#f7f0ff;--purple:#8e33f5;--line:#e9def7;--muted:#766985}
    *{box-sizing:border-box}html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden}body{background:#f7f5fb;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    main{position:relative;width:100%;height:100%;background:#fff}.app-frame{display:block;width:100%;height:100%;border:0;background:#f7f5fb}
    .controls{position:fixed;z-index:2;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;pointer-events:none}.control-button,.external-link{pointer-events:auto;min-height:36px;padding:8px 12px;border:1px solid #e9def7;border-radius:999px;background:#fff;color:#59456c;text-decoration:none;font-size:11px;font-weight:700;font-family:inherit;white-space:nowrap;box-shadow:0 3px 14px #2b174226}.control-button{display:none}.control-button.visible{display:block}.control-button[hidden]{display:none}.control-button:focus-visible,.external-link:focus-visible{outline:3px solid #8e33f5;outline-offset:2px}.external-link{background:#8e33f5;color:#fff;border-color:#8e33f5}
    .frame-status{position:fixed;z-index:1;left:12px;right:12px;top:50%;transform:translateY(-50%);margin:auto;width:max-content;max-width:calc(100% - 24px);padding:9px 13px;border:1px solid #e9def7;border-radius:12px;background:#fff;color:#766985;font-size:12px;box-shadow:0 5px 18px #2b17421c}.frame-status[hidden]{display:none}.install-help{position:fixed;z-index:2;left:12px;right:12px;bottom:calc(54px + env(safe-area-inset-bottom));max-width:560px;margin:auto;padding:11px 14px;border:1px solid #e9def7;border-radius:14px;background:#fff;color:#766985;font-size:12px;line-height:1.55;box-shadow:0 5px 18px #2b17421c;text-align:center}.install-help[hidden]{display:none}.install-help strong{color:#49385a}
  </style>
</head>
<body>
  <main>
    <iframe id="appFrame" class="app-frame" title="Aplikasi GPS FM" src="https://script.google.com/macros/s/AKfycbyL4HyR75j-duBKliOJLgtNvXVdajQFvy1AKq6zmFWudA5rBK0zI7nFbxH2WuCqkemR/exec" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <p id="frameStatus" class="frame-status" role="status" aria-live="polite">Memuat aplikasi GPS FM…</p>
    <div id="installHelp" class="install-help" hidden>Untuk memasang GPS FM di iPhone/iPad: buka halaman ini di Safari, ketuk <strong>Bagikan</strong>, lalu pilih <strong>Tambahkan ke Layar Utama</strong>.</div>
  </main>
  <nav class="controls" aria-label="Opsi aplikasi">
    <button id="installButton" class="control-button" type="button" hidden>Pasang GPS FM</button>
    <a class="external-link" href="https://script.google.com/macros/s/AKfycbyL4HyR75j-duBKliOJLgtNvXVdajQFvy1AKq6zmFWudA5rBK0zI7nFbxH2WuCqkemR/exec" target="_blank" rel="noopener">Buka terpisah</a>
  </nav>
  <script>
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
    const appFrame=document.getElementById('appFrame');
    const frameStatus=document.getElementById('frameStatus');
    const installButton=document.getElementById('installButton');
    const installHelp=document.getElementById('installHelp');
    let deferredInstallPrompt=null;
    appFrame.addEventListener('load',()=>{frameStatus.hidden=true});
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;installButton.hidden=false;installButton.classList.add('visible');installHelp.hidden=true});
    installButton.addEventListener('click',async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installButton.hidden=true});
    window.addEventListener('appinstalled',()=>{installButton.hidden=true;installHelp.hidden=true});
    const installed=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
    if(!installed&&/(iPhone|iPad|iPod)/i.test(navigator.userAgent))installHelp.hidden=false;
  </script>
</body>
</html>
